<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fast-Flux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --accent: #2f81f7;
      --accent-bright: #58a6ff;
      --accent-glow: rgba(47, 129, 247, 0.3);
      --text: #e6edf3;
      --muted: #8b949e;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 300px;
      padding: 0;
      overflow: hidden;
    }
    .popup-inner {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-row img {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }
    .logo-info h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-bright);
      letter-spacing: -0.3px;
    }
    .logo-info p {
      font-size: 11px;
      color: var(--muted);
    }
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-glow);
      transition: all 0.15s ease;
    }
    .action-btn:hover {
      background: var(--accent-bright);
      transform: translateY(-1px);
    }
    .note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .stats {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .stat-row + .stat-row { margin-top: 6px; }
    .stat-label { color: var(--muted); }
    .stat-value { font-weight: 600; color: var(--accent-bright); font-variant-numeric: tabular-nums; }
    .stat-value.green { color: #3fb950; }
    .stat-value.red { color: #f85149; }
    .stat-value.orange { color: #d29922; }
  </style>
</head>
<body>
  <div class="popup-inner">
    <div class="logo-row">
      <img src="icons/icon48.png" alt="Fast-Flux">
      <div class="logo-info">
        <h1>Fast-Flux</h1>
        <p>Turbo Segment Downloader</p>
      </div>
    </div>

    <div class="stats" id="statsBox">
      <div class="stat-row">
        <span class="stat-label">Active Jobs</span>
        <span class="stat-value" id="statActive">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Completed</span>
        <span class="stat-value green" id="statCompleted">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Failed</span>
        <span class="stat-value red" id="statFailed">0</span>
      </div>
    </div>

    <div class="divider"></div>

    <button class="action-btn" id="openPanelBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
      Open Full Panel
    </button>

    <p class="note">
      For the best experience, use the Side Panel.<br>
      Click the button above or press the panel icon.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
